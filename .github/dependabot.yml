# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "annotations"
      # test-only database drivers: should match the versions Paper ships, not the latest
      - dependency-name: "com.mysql:mysql-connector-j"
      - dependency-name: "org.xerial:sqlite-jdbc"
      # repo.alessiodp.com answers Dependabot (not Gradle) with an authentication error for artifacts it does not host,
      # which fails the whole run; these plugin APIs are compileOnly, update them by hand
      - dependency-name: "org.mvplugins.multiverse.core:multiverse-core"
      - dependency-name: "org.mvplugins.multiverse.inventories:multiverse-inventories"
      - dependency-name: "net.citizensnpcs:citizens-main"
      - dependency-name: "de.oliver:FancyNpcs"
      - dependency-name: "de.simonsator:spigot-party-api-for-party-and-friends"
      - dependency-name: "de.simonsator:Party-and-Friends-MySQL-Edition-Spigot-API"
