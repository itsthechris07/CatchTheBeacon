# Publishes a release on GitHub when a version tag is pushed (the update checker of the plugin reads these releases):
#   1. set `version` in build.gradle.kts (e.g. 1.1.0) and commit
#   2. git tag v1.1.0 && git push origin v1.1.0
# Versions with a '-' (1.1.0-beta) become pre-releases, which the update checker doesn't offer.
name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5

      - name: Check the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match the version $version in build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build (with tests)
        run: chmod +x gradlew && ./gradlew :build

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "build/libs/CatchTheBeacon-$VERSION.jar" \
            --title "CatchTheBeacon $VERSION" --generate-notes $flags
