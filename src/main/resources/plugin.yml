name: CatchTheBeacon
version: ${version}
author: Christian34
description: Cores minigame - Red vs Blue, break both enemy beacons to win
website: https://itsthechris07.github.io/CatchTheBeacon/
main: com.christian34.catchthebeacon.CatchTheBeacon
# the current version only: older ones make Paper rewrite the bytecode of the plugin for old api calls
api-version: "26.2"
# commands are registered by cloud (commands/CommandManager)

softdepend: [Vault, PlaceholderAPI, MiniPlaceholders, Parties, Spigot-Party-API-PAF, Citizens, FancyNpcs, floodgate, TAB, Essentials, Multiverse-Core, Multiverse-Inventories]

permissions:
  ctb.network.bypass:
    description: not put into the game when joining a game server (network.mode game), e.g. to set up the arena
    # not even for operators, who would otherwise never get into the game
    default: false
