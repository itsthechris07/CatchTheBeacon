#
# chat_color: a color code (0-9, a-f), a color name (red, dark_blue, ...) or a hex color (#ff0000)
# name: optional, e.g. name: "Fire" - without it the name comes from the messages (team_red, ... in the language of config.yml)
#

teams:
  blue:
    chat_color: "9"
    item: "BLUE_WOOL"
    leather_color: "0, 0, 205"
  red:
    chat_color: "c"
    item: "RED_WOOL"
    leather_color: "176, 46, 38"
  random:
    chat_color: "a"
    item: "WHITE_WOOL"
    leather_color: "255, 255, 255"